services:
  wbti:
    image: xiaoyuyu123/magical-girls-witch-trial:latest
    container_name: wbti-app
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - /home/wbti/data:/app/data
      - /home/wbti/backups:/backups
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:./db/wbti.db
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

services:
  wbti:
    image: xiaoyuyu123/magical-girls-witch-trial:latest
    container_name: wbti-app
    ports:
      - "8080:3000"
    volumes:
      - /home/wbti/data/prisma/db:/app/prisma/db
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:./db/wbti.db
    restart: always
